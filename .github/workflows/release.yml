name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $match) { throw 'Package version not found in Cargo.toml' }
          $expected = 'v' + $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match $expected"
          }

      - name: Test
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo tests failed' }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Record SHA-256
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/winime_en-Setup-*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/winime_en-Setup-*.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: winime_en-installer
          if-no-files-found: error
          path: |
            dist/winime_en-Setup-*.exe
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winime_en-installer
          path: dist

      - name: Verify downloaded installer
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/winime_en-Setup-*.exe dist/SHA256SUMS.txt \
            --verify-tag --generate-notes
